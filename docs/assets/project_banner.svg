<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="430" viewBox="0 0 1600 430" role="img" aria-labelledby="title desc">
  <title id="title">Compressor Health Clustering</title>
  <desc id="desc">A dark, technical banner with a simplified air compressor and sensor lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141d24"/>
      <stop offset="1" stop-color="#27343b"/>
    </linearGradient>
    <linearGradient id="tank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#52636a"/>
      <stop offset="1" stop-color="#29363c"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#91a4a7" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="430" rx="18" fill="url(#bg)"/>
  <rect width="1600" height="430" rx="18" fill="url(#grid)"/>
  <path d="M0 346 C250 300 420 395 660 345 S1080 320 1600 364" fill="none" stroke="#51c2c5" stroke-opacity=".15" stroke-width="2"/>
  <path d="M0 374 C250 329 420 423 660 374 S1080 347 1600 392" fill="none" stroke="#e4a95f" stroke-opacity=".13" stroke-width="2"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="82" y="65" width="8" height="42" rx="4" fill="#e39a54"/>
    <text x="112" y="91" fill="#9fb6b7" font-size="18" font-weight="700" letter-spacing="4">METROPT-3  /  HISTORICAL STUDY</text>
    <text x="80" y="178" fill="#f2f0e8" font-family="Georgia, Times New Roman, serif" font-size="64" letter-spacing="-1.5">Compressor</text>
    <text x="80" y="246" fill="#f2f0e8" font-family="Georgia, Times New Roman, serif" font-size="64" letter-spacing="-1.5">Health Clustering</text>
    <text x="84" y="300" fill="#bbc8c7" font-size="21">Discover operating patterns. Review unusual behavior.</text>
    <text x="84" y="332" fill="#bbc8c7" font-size="21">Keep the evidence—and the limitations—in view.</text>
    <rect x="84" y="365" width="186" height="36" rx="18" fill="#2d4849" stroke="#4f7776"/>
    <circle cx="106" cy="383" r="5" fill="#7fc8b3"/>
    <text x="122" y="389" fill="#d6e9e2" font-size="13" font-weight="700" letter-spacing="1.5">OFFLINE ANALYSIS</text>
  </g>

  <!-- Simplified air compressor, receiver tank, piping, and gauge. -->
  <g transform="translate(900 54)" stroke-linejoin="round" stroke-linecap="round">
    <path d="M86 290H595" stroke="#8ea0a1" stroke-width="5" opacity=".75"/>
    <path d="M121 288V319M536 288V319" stroke="#8ea0a1" stroke-width="8"/>
    <rect x="156" y="197" width="214" height="91" rx="18" fill="#36464c" stroke="#91a4a7" stroke-width="2"/>
    <rect x="180" y="215" width="122" height="54" rx="8" fill="#1d292e" stroke="#70868a"/>
    <path d="M202 242h76M220 224v36M241 224v36M262 224v36" stroke="#58b8bb" stroke-width="3" opacity=".9"/>
    <circle cx="338" cy="242" r="18" fill="#202c31" stroke="#e2a65f" stroke-width="3"/>
    <path d="M338 242l8-8" stroke="#f1d4a8" stroke-width="3"/>
    <rect x="390" y="118" width="133" height="170" rx="64" fill="url(#tank)" stroke="#a5b1ad" stroke-width="2"/>
    <path d="M405 158h103M404 247h105" stroke="#95a8a7" stroke-opacity=".65" stroke-width="2"/>
    <path d="M370 238h20M456 118V90h67V71" fill="none" stroke="#d8a25f" stroke-width="7"/>
    <path d="M523 71h55v44h32" fill="none" stroke="#65c5c3" stroke-width="7"/>
    <circle cx="610" cy="115" r="27" fill="#1d292e" stroke="#a9b9b4" stroke-width="3"/>
    <path d="M610 115l11-13" stroke="#e6aa63" stroke-width="3"/>
    <path d="M600 94l-4 5M620 95l4 5M632 114l-6 1M609 137v-6" stroke="#c7d1cb" stroke-width="2"/>
    <path d="M105 190h49M102 205h54M120 180v-21h66" fill="none" stroke="#6eb6b5" stroke-width="4" opacity=".8"/>
    <circle cx="120" cy="159" r="7" fill="#e3a15c"/>
    <path d="M80 287v-35h38" fill="none" stroke="#91a4a7" stroke-width="5"/>
    <circle cx="81" cy="248" r="11" fill="#26343a" stroke="#e3a15c" stroke-width="3"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">Compressor Health Clustering project goal and evidence roadmap</title>
  <desc id="desc">The project turns historical MetroPT-3 data into interpretable operating patterns, checks those patterns against event context, and defines evidence needed before stronger maintenance claims.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171a26"/><stop offset="1" stop-color="#302d3d"/></linearGradient>
    <linearGradient id="violet" x1="0" x2="1"><stop stop-color="#9c8cff"/><stop offset="1" stop-color="#70d9cb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#080911" flood-opacity=".34"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8a879c"/></marker>
  </defs>
  <rect width="1500" height="500" rx="28" fill="url(#bg)"/>
  <text x="54" y="55" fill="#f2f0fa" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">PROJECT GOAL · WHAT WE CAN LEARN, AND WHAT MUST COME NEXT</text>
  <text x="54" y="84" fill="#bab7c8" font-family="Segoe UI,Arial,sans-serif" font-size="15">A historical research workflow for exploring compressor behavior — built with explicit evidence boundaries.</text>
  <g font-family="Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(54 128)"><rect width="316" height="230" rx="20" fill="#373547" stroke="#5a536e"/><circle cx="38" cy="38" r="20" fill="url(#violet)"/><text x="38" y="44" text-anchor="middle" fill="#171724" font-size="17" font-weight="700">A</text><text x="27" y="92" fill="#f3f1f8" font-size="20" font-weight="700">Observe</text><text x="27" y="128" fill="#c7c3d2" font-size="15">Check cadence, missingness,</text><text x="27" y="153" fill="#c7c3d2" font-size="15">gaps, signal distributions,</text><text x="27" y="178" fill="#c7c3d2" font-size="15">and reported event context.</text><rect x="27" y="195" width="164" height="23" rx="11" fill="#4c485e"/><text x="109" y="211" text-anchor="middle" fill="#d5d1e1" font-size="12">RELIABLE DATA BASIS</text></g>
    <g transform="translate(424 128)"><rect width="316" height="230" rx="20" fill="#373547" stroke="#5a536e"/><circle cx="38" cy="38" r="20" fill="url(#violet)"/><text x="38" y="44" text-anchor="middle" fill="#171724" font-size="17" font-weight="700">B</text><text x="27" y="92" fill="#f3f1f8" font-size="20" font-weight="700">Describe</text><text x="27" y="128" fill="#c7c3d2" font-size="15">Summarize sensor behavior</text><text x="27" y="153" fill="#c7c3d2" font-size="15">in five-minute windows and</text><text x="27" y="178" fill="#c7c3d2" font-size="15">group recurring patterns.</text><rect x="27" y="195" width="185" height="23" rx="11" fill="#4c485e"/><text x="119" y="211" text-anchor="middle" fill="#d5d1e1" font-size="12">INTERPRETABLE EXPLORATION</text></g>
    <g transform="translate(794 128)"><rect width="316" height="230" rx="20" fill="#373547" stroke="#5a536e"/><circle cx="38" cy="38" r="20" fill="url(#violet)"/><text x="38" y="44" text-anchor="middle" fill="#171724" font-size="17" font-weight="700">C</text><text x="27" y="92" fill="#f3f1f8" font-size="20" font-weight="700">Review</text><text x="27" y="128" fill="#c7c3d2" font-size="15">Track shifts and unusual</text><text x="27" y="153" fill="#c7c3d2" font-size="15">windows; compare cautiously</text><text x="27" y="178" fill="#c7c3d2" font-size="15">with documented events.</text><rect x="27" y="195" width="191" height="23" rx="11" fill="#4c485e"/><text x="122" y="211" text-anchor="middle" fill="#d5d1e1" font-size="12">HISTORICAL EVIDENCE</text></g>
    <g transform="translate(1164 128)"><rect width="282" height="230" rx="20" fill="#273c3b" stroke="#46736a"/><circle cx="38" cy="38" r="20" fill="url(#violet)"/><text x="38" y="44" text-anchor="middle" fill="#171724" font-size="17" font-weight="700">D</text><text x="27" y="92" fill="#f3f7f4" font-size="20" font-weight="700">Validate next</text><text x="27" y="128" fill="#c6d8d2" font-size="15">Hold out verified faults.</text><text x="27" y="153" fill="#c6d8d2" font-size="15">Measure warning lead time,</text><text x="27" y="178" fill="#c6d8d2" font-size="15">misses, and false alarms.</text><rect x="27" y="195" width="205" height="23" rx="11" fill="#35534e"/><text x="129" y="211" text-anchor="middle" fill="#d9ebe4" font-size="12">BEFORE OPERATIONAL CLAIMS</text></g>
  </g>
  <g stroke="#8a879c" stroke-width="3" marker-end="url(#arrow)"><path d="M378 244h38"/><path d="M748 244h38"/><path d="M1118 244h38"/></g>
  <rect x="54" y="390" width="1392" height="66" rx="16" fill="#222331" stroke="#494357"/>
  <text x="78" y="418" fill="#b3a6ff" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">CURRENT EVIDENCE BOUNDARY</text>
  <text x="78" y="441" fill="#dfdce8" font-family="Segoe UI,Arial,sans-serif" font-size="15">One compressor · one historical period · coarse event notes · unsupervised clusters · no live sensors or verified row-level fault labels</text>
</svg>

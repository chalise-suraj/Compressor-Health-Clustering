<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="490" viewBox="0 0 1500 490" role="img" aria-labelledby="title desc">
  <title id="title">Compressor operating-behavior model design</title>
  <desc id="desc">Five-minute sensor windows are represented by 37 features, split chronologically, preprocessed using training data, grouped by provisional K-Means, then reviewed through cluster profiles and distance diagnostics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111a22"/><stop offset="1" stop-color="#263642"/></linearGradient>
    <linearGradient id="green" x1="0" x2="1"><stop stop-color="#34d6bd"/><stop offset="1" stop-color="#87e3aa"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".3"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#77909d"/></marker>
  </defs>
  <rect width="1500" height="490" rx="26" fill="url(#bg)"/>
  <text x="52" y="55" fill="#eef5f6" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">MODEL DESIGN · FROM WINDOW FEATURES TO REVIEW</text>
  <text x="52" y="83" fill="#a9bbc4" font-family="Segoe UI,Arial,sans-serif" font-size="15">The model groups similar feature vectors; no health or failure target is supplied.</text>
  <g font-family="Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(48 124)"><rect width="235" height="176" rx="16" fill="#34434f" stroke="#506574"/><text x="20" y="36" fill="#73e2cb" font-size="13" font-weight="700">01 · REPRESENT</text><text x="20" y="72" fill="#f1f6f7" font-size="19" font-weight="700">Five-minute windows</text><text x="20" y="105" fill="#c1cdd2" font-size="15">37 numeric features</text><text x="20" y="132" fill="#a4b5bd" font-size="14">Analog statistics + state</text><text x="20" y="154" fill="#a4b5bd" font-size="14">fractions + transitions</text></g>
    <g transform="translate(340 124)"><rect width="235" height="176" rx="16" fill="#34434f" stroke="#506574"/><text x="20" y="36" fill="#73e2cb" font-size="13" font-weight="700">02 · HOLD OUT TIME</text><text x="20" y="72" fill="#f1f6f7" font-size="19" font-weight="700">Chronological split</text><text x="20" y="105" fill="#c1cdd2" font-size="15">40,349 training windows</text><text x="20" y="132" fill="#c1cdd2" font-size="15">10,088 later holdout</text><text x="20" y="154" fill="#a4b5bd" font-size="14">No random time mixing</text></g>
    <g transform="translate(632 124)"><rect width="235" height="176" rx="16" fill="#34434f" stroke="#506574"/><text x="20" y="36" fill="#73e2cb" font-size="13" font-weight="700">03 · TRANSFORM</text><text x="20" y="72" fill="#f1f6f7" font-size="19" font-weight="700">Training-only fit</text><text x="20" y="105" fill="#c1cdd2" font-size="15">Median imputation</text><text x="20" y="132" fill="#c1cdd2" font-size="15">Robust scaling</text><text x="20" y="154" fill="#a4b5bd" font-size="14">Then transform holdout</text></g>
    <g transform="translate(924 124)"><rect width="235" height="176" rx="16" fill="#34434f" stroke="#506574"/><text x="20" y="36" fill="#73e2cb" font-size="13" font-weight="700">04 · GROUP</text><text x="20" y="72" fill="#f1f6f7" font-size="19" font-weight="700">K-Means · k = 4</text><text x="20" y="105" fill="#c1cdd2" font-size="15">k-means++ · n_init 20</text><text x="20" y="132" fill="#c1cdd2" font-size="15">random_state 42</text><text x="20" y="154" fill="#a4b5bd" font-size="14">Saved choice is provisional</text></g>
    <g transform="translate(1216 124)"><rect width="235" height="176" rx="16" fill="#34434f" stroke="#506574"/><text x="20" y="36" fill="#73e2cb" font-size="13" font-weight="700">05 · INSPECT</text><text x="20" y="72" fill="#f1f6f7" font-size="19" font-weight="700">Profiles + distance</text><text x="20" y="105" fill="#c1cdd2" font-size="15">Cluster mix over time</text><text x="20" y="132" fill="#c1cdd2" font-size="15">Unusual-window review</text><text x="20" y="154" fill="#a4b5bd" font-size="14">Context, not diagnosis</text></g>
  </g>
  <g stroke="#77909d" stroke-width="3" marker-end="url(#arrow)"><path d="M290 212h42"/><path d="M582 212h42"/><path d="M874 212h42"/><path d="M1166 212h42"/></g>
  <rect x="48" y="328" width="1403" height="104" rx="17" fill="#17272d" stroke="#356259"/>
  <text x="72" y="360" fill="#79e1cd" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">MODEL SELECTION CHECK</text>
  <text x="72" y="391" fill="#e8f1f1" font-family="Segoe UI,Arial,sans-serif" font-size="17">k=3 candidate silhouette 0.9429</text>
  <text x="430" y="391" fill="#9eb2ba" font-family="Segoe UI,Arial,sans-serif" font-size="17">vs.</text>
  <text x="478" y="391" fill="#e8f1f1" font-family="Segoe UI,Arial,sans-serif" font-size="17">k=4 candidate silhouette 0.9375</text>
  <text x="920" y="391" fill="#b4c3c8" font-family="Segoe UI,Arial,sans-serif" font-size="15">Silhouette measures geometric separation, not fault performance.</text>
  <text x="52" y="466" fill="#91a2aa" font-family="Segoe UI,Arial,sans-serif" font-size="13">Holdout labels are predicted using the training-fitted pipeline; no refit on later data.</text>
</svg>

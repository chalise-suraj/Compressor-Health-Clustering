<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="440" viewBox="0 0 1500 440" role="img" aria-labelledby="title desc">
  <title id="title">Five-minute compressor clustering pipeline</title>
  <desc id="desc">Sensor readings are summarized into five-minute windows and 37 features, transformed with a training-only preprocessing pipeline, assigned to provisional K-Means clusters, and reviewed using distance alerts and event context.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171e27"/><stop offset="1" stop-color="#252f3a"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#48d7bd"/><stop offset="1" stop-color="#7fdbb7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#070b10" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6b7b88"/></marker>
  </defs>
  <rect width="1500" height="440" rx="28" fill="url(#bg)"/>
  <text x="58" y="58" fill="#edf4f5" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">FROM SENSOR HISTORY TO REVIEWABLE OPERATING PATTERNS</text>
  <text x="58" y="88" fill="#aab8c2" font-family="Segoe UI,Arial,sans-serif" font-size="15">Unsupervised grouping for exploration — no fault labels or live alarms are produced.</text>
  <g font-family="Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(52 132)"><rect width="245" height="180" rx="18" fill="#303b47" stroke="#435362"/><circle cx="31" cy="31" r="17" fill="#48d7bd"/><text x="31" y="37" text-anchor="middle" fill="#142027" font-size="16" font-weight="700">1</text><text x="24" y="77" fill="#f2f6f7" font-size="19" font-weight="700">Sensor history</text><text x="24" y="108" fill="#b8c5ce" font-size="15">1,516,948 rows</text><text x="24" y="133" fill="#b8c5ce" font-size="15">15 signals · ~10s cadence</text><text x="24" y="158" fill="#82939f" font-size="13">Gaps split into segments</text></g>
    <g transform="translate(348 132)"><rect width="245" height="180" rx="18" fill="#303b47" stroke="#435362"/><circle cx="31" cy="31" r="17" fill="#48d7bd"/><text x="31" y="37" text-anchor="middle" fill="#142027" font-size="16" font-weight="700">2</text><text x="24" y="77" fill="#f2f6f7" font-size="19" font-weight="700">Window features</text><text x="24" y="108" fill="#b8c5ce" font-size="15">5-minute summaries</text><text x="24" y="133" fill="#b8c5ce" font-size="15">37 numeric features</text><text x="24" y="158" fill="#82939f" font-size="13">147 low-coverage excluded</text></g>
    <g transform="translate(644 132)"><rect width="245" height="180" rx="18" fill="#303b47" stroke="#435362"/><circle cx="31" cy="31" r="17" fill="#48d7bd"/><text x="31" y="37" text-anchor="middle" fill="#142027" font-size="16" font-weight="700">3</text><text x="24" y="77" fill="#f2f6f7" font-size="19" font-weight="700">Train-only prep</text><text x="24" y="108" fill="#b8c5ce" font-size="15">Median imputation</text><text x="24" y="133" fill="#b8c5ce" font-size="15">Robust scaling</text><text x="24" y="158" fill="#82939f" font-size="13">Chronological 80 / 20 split</text></g>
    <g transform="translate(940 132)"><rect width="245" height="180" rx="18" fill="#303b47" stroke="#435362"/><circle cx="31" cy="31" r="17" fill="#48d7bd"/><text x="31" y="37" text-anchor="middle" fill="#142027" font-size="16" font-weight="700">4</text><text x="24" y="77" fill="#f2f6f7" font-size="19" font-weight="700">K-Means groups</text><text x="24" y="108" fill="#b8c5ce" font-size="15">Provisional k = 4</text><text x="24" y="133" fill="#b8c5ce" font-size="15">50,437 assigned windows</text><text x="24" y="158" fill="#82939f" font-size="13">Cluster IDs are arbitrary</text></g>
    <g transform="translate(1236 132)"><rect width="220" height="180" rx="18" fill="#303b47" stroke="#435362"/><circle cx="31" cy="31" r="17" fill="#48d7bd"/><text x="31" y="37" text-anchor="middle" fill="#142027" font-size="16" font-weight="700">5</text><text x="24" y="77" fill="#f2f6f7" font-size="19" font-weight="700">Review</text><text x="24" y="108" fill="#b8c5ce" font-size="15">Trends · distances</text><text x="24" y="133" fill="#b8c5ce" font-size="15">Event context</text><text x="24" y="158" fill="#82939f" font-size="13">Offline dashboard</text></g>
  </g>
  <g stroke="#71818d" stroke-width="3" marker-end="url(#arrow)"><path d="M304 222h34"/><path d="M600 222h34"/><path d="M896 222h34"/><path d="M1192 222h34"/></g>
  <rect x="52" y="344" width="1404" height="54" rx="14" fill="#172a2d" stroke="#2d6259"/>
  <circle cx="78" cy="371" r="7" fill="url(#accent)"/><text x="98" y="377" fill="#c9e4de" font-family="Segoe UI,Arial,sans-serif" font-size="15">Interpretation guardrail: k=3 scored higher on candidate silhouette (0.9429 vs 0.9375); k=4 remains provisional for review.</text>
</svg>
